    <style>
        /* test css color mix… just for fun. */
        body { 
            background: pink; 
 
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/color_value/color-mix */
            /* color mix */
            background: color-mix(in srgb, pink, blue);
 
            /* color mix with % */
            background: color-mix(in srgb, pink 80%, blue 20%);
 
            /* color variable */
            --myColor: #f1357A;

            /* color mix with variable */
            background: color-mix(in srgb, var(--myColor) 80%, blue 20%);
            
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Colors/Using_relative_colors */
            /* relative color: "from" */
            background: hsl( from #F1357A h s l );

            /* remplace les varaibles h s l avec un autre valeur */
            background: hsl( from #F1357A h s 50% );

            /* valeur hue calculée */
            background: hsl( from #F1357A calc(h + 20) s l );

            /* color system */
            --primary100: hsl(from var(--myColor) h s 10%);
            --primary200: hsl(from var(--myColor) h s 20%); 
            --primary300: hsl(from var(--myColor) h s 30%); 
            --primary400: hsl(from var(--myColor) h s 40%);
            --primary500: hsl(from var(--myColor) h s 50%);
            --primary600: hsl(from var(--myColor) h s 60%);
            --primary700: hsl(from var(--myColor) h s 70%);
            --primary800: hsl(from var(--myColor) h s 80%);
            --primary900: hsl(from var(--myColor) h s 90%);
            
            background: var(--primary800); 
        }
    </style>

</head>

    <div class="lb" id="lb" aria-hidden="true">
        <button type="button" aria-label="Fermer">×</button>
        <iframe allow="camera; microphone; autoplay"></iframe>
    </div>
    <style>
        .lb { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; z-index: 9999; }
        .lb.open { display: block; }
        .lb iframe { position: absolute; top: 5vh; left: 5vw; width: 90vw; height: 90vh; border: 0; background: #fff; }
        .lb button { z-index: 99; position: absolute; top: 1rem; right: 1rem; width: 3rem; height: 3rem; font-size: 1.5rem; background: #fff; border: 0; cursor: pointer; }
    </style>
    <script>
        function makeLightbox(){
            const lb = document.getElementById('lb');
            const frame = lb.querySelector('iframe');
            const close = lb.querySelector('button');
        
            const open = url => { frame.src = url; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); };
            const shut = () => { frame.src = 'about:blank'; lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); };
        
            document.querySelectorAll('.gallery a').forEach(a => {
                a.addEventListener('click', e => { e.preventDefault(); open(a.href); });
            });
            close.addEventListener('click', shut);
            lb.addEventListener('click', e => { if (e.target === lb) shut(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('open')) shut(); });
        }
        makeLightbox();
    </script>
